name: SXKC

options:
  bundleIdPrefix: cn.sxkc
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # 关键：整条链路都不签名，产物是裸 .app，交给 TrollStore 用 ldid 伪签名
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    # 注意：这里不能再写 CODE_SIGN_ENTITLEMENTS: ""
    # 那会把下面 entitlements 段生成的路径覆盖掉，App Group 就没了，
    # 小组件会一直显示「状态未知」。

targets:
  SXKC:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    # ────────────────────────────────────────────────────────────────
    # 白名单：只编译这两个文件。
    # SharedKit.swift 必须同时出现在这里和小组件 target 里 ——
    # 它是两边共用的数据结构，各编一份、用同一个 group id 才能对上。
    #
    # 仓库里原来 SXKC/Core、SXKC/UI 等目录的文件不用删，
    # 它们不在清单里，就不会被编译，也不会和 All.swift 撞名。
    # ────────────────────────────────────────────────────────────────
    sources:
      - path: SXKC/All.swift
      - path: SXKC/SharedKit.swift
      # 图标资源。仓库里 SXKC/Assets.xcassets 已经存在（之前传过），
      # 必须列进来，否则 ASSETCATALOG_COMPILER_APPICON_NAME 找不到图标，
      # 装到手机上会是个白块，很难认。
      - path: SXKC/Assets.xcassets
    dependencies:
      - target: SXKCWidget
      # 1.34：内置地图。MapKit 是系统框架，显式列一下，免得无签名构建时漏链
      - sdk: MapKit.framework
    entitlements:
      path: SXKC/SXKC.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.sxkc.lite
    info:
      path: SXKC/Info.plist
      properties:
        CFBundleDisplayName: 五菱控车
        CFBundleName: SXKC
        CFBundleShortVersionString: "1.36"
        CFBundleVersion: "36"
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: 需要连接车机蓝牙，用于开锁、锁车与靠近自动解锁。
        NSBluetoothPeripheralUsageDescription: 需要连接车机蓝牙。
        NSLocationWhenInUseUsageDescription: 用于计算手机与车辆的距离：靠近 10 米自动开锁，离开 30 米自动锁车。
        NSLocationAlwaysAndWhenInUseUsageDescription: 锁屏后也要按距离判断是否开关锁。不需要后台判距时，请在 App 里关掉「后台持续定位」。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - bluetooth-central
          - location
        # 小组件上的按钮靠这个 scheme 把 App 拉起来
        CFBundleURLTypes:
          - CFBundleURLName: cn.sxkc.lite.url
            CFBundleURLSchemes:
              - sxkc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.sxkc.lite
        PRODUCT_NAME: SXKC
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.36"
        CURRENT_PROJECT_VERSION: "36"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

  SXKCWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: SXKC/SharedKit.swift
      - path: SXKC/SXKCWidget.swift
    entitlements:
      path: SXKC/SXKCWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.sxkc.lite
    info:
      path: SXKC/SXKCWidgetInfo.plist
      properties:
        CFBundleDisplayName: 五菱控车小组件
        CFBundleShortVersionString: "1.36"
        CFBundleVersion: "36"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.sxkc.lite.widget
        PRODUCT_NAME: SXKCWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  SXKC:
    build:
      targets:
        SXKC: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
