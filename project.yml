name: SXKC

options:
  bundleIdPrefix: cn.sxkc
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # 关键：整条链路都不签名，产物是裸 .app，交给 TrollStore 用 ldid 伪签名
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  SXKC:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: SXKC
        excludes:
          - "Info.plist"
    info:
      path: SXKC/Info.plist
      properties:
        CFBundleDisplayName: 顺心控车
        CFBundleName: SXKC
        CFBundleShortVersionString: "1.19"
        CFBundleVersion: "19"
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: 需要连接车机蓝牙，用于开锁、锁车与靠近自动解锁。
        NSBluetoothPeripheralUsageDescription: 需要连接车机蓝牙。
        NSLocationWhenInUseUsageDescription: 用于计算手机与车辆的距离：靠近 10 米自动开锁，离开 30 米自动锁车。
        NSLocationAlwaysAndWhenInUseUsageDescription: 锁屏后也要按距离判断是否开关锁。不需要后台判距时，请在 App 里关掉「后台持续定位」。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - bluetooth-central
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.sxkc.lite
        PRODUCT_NAME: SXKC
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.19"
        CURRENT_PROJECT_VERSION: "19"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

schemes:
  SXKC:
    build:
      targets:
        SXKC: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
